[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tradingchassis-core-runtime"
version = "0.1.0"
description = "Runtime and Kubernetes orchestration layer for TradingChassis Core with reproducible environments and deterministic Backtesting."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "TradingChassis Core Runtime Contributors", email = "tradingeng@protonmail.com" }]
license = { text = "MIT" }

dependencies = [
  "hftbacktest>=2,<3",
  "mlflow>=3,<4",
  "oci>=2,<3",
  "prometheus-client>=0.24,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=9,<10",
  "import-linter>=1.11,<2",
  "ruff>=0.4,<1",
  "mypy>=1.9,<2",
]

# --------------------------------------------------
# Explicit package discovery
# --------------------------------------------------
[tool.setuptools.packages.find]
include = ["core_runtime*"]

# --------------------------------------------------
# Include runtime assets
# --------------------------------------------------
[tool.setuptools.package-data]
core_runtime = ["**/*"]

[tool.setuptools]
include-package-data = true

# --------------------------------------------------
# Pytest
# --------------------------------------------------
[tool.pytest.ini_options]
minversion = "9.0"
addopts = "-ra"
testpaths = ["tests"]

# --------------------------------------------------
# Ruff
# --------------------------------------------------
[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

# --------------------------------------------------
# MyPy (static typing)
# --------------------------------------------------
[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
ignore_missing_imports = true
pretty = true
show_error_codes = true
ignore_errors = true

# --------------------------------------------------
# Import Linter
# --------------------------------------------------
[tool.importlinter]
root_package = "core_runtime"
include_external_packages = true
